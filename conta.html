<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar ou criar conta — Adriana Melo Acessórios</title>
<meta name="description" content="Entre na sua conta ou cadastre-se para acompanhar seus pedidos na Adriana Melo Acessórios.">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; script-src 'self' https://cdnjs.cloudflare.com https://sdk.mercadopago.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' https://picsum.photos https://fastly.picsum.photos data:; connect-src 'self' https://api.mercadopago.com https://viacep.com.br; frame-src https://www.mercadopago.com https://www.mercadopago.com.br; object-src 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">

<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="bow-shape" viewBox="0 0 100 70">
    <path d="M50 35 C50 35 38 6 15 10 C-4 13 -4 47 15 51 C36 56 50 35 50 35 Z"/>
    <path d="M50 35 C50 35 62 6 85 10 C104 13 104 47 85 51 C64 56 50 35 50 35 Z"/>
    <rect x="42" y="26" width="16" height="18" rx="5"/>
    <path d="M45 44 L38 68 L48 60 Z"/>
    <path d="M55 44 L62 68 L52 60 Z"/>
  </symbol>
</svg>

<header class="simple-header">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="index.html" class="plc-brand">
      <svg class="bow-icon"><use href="#bow-shape"/></svg>
      Adriana Melo Acessórios
    </a>
    <div id="navAccount" class="d-flex align-items-center gap-2"></div>
  </div>
</header>

<main class="account-main">
  <div class="container">
    <div class="account-card mx-auto">

      <div id="alreadyLoggedIn" class="d-none text-center py-3">
        <i class="bi bi-check-circle" style="font-size:2rem; color:var(--blush-600)"></i>
        <p class="mt-3 mb-1">Você já está logado como</p>
        <p class="fw-semibold font-display mb-4" id="alreadyName" style="font-size:1.2rem"></p>
        <a href="pedidos.html" class="btn-blush d-block w-100 mb-2">Ver meus pedidos</a>
        <a href="index.html" class="btn-outline-blush d-block w-100">Voltar para a loja</a>
      </div>

      <div id="authForms">
        <ul class="nav account-tabs mb-4" id="authTabs" role="tablist">
          <li class="nav-item flex-fill" role="presentation">
            <button class="nav-link active w-100" id="tab-login-btn" data-bs-toggle="pill" data-bs-target="#tab-login" type="button" role="tab" aria-selected="true">Entrar</button>
          </li>
          <li class="nav-item flex-fill" role="presentation">
            <button class="nav-link w-100" id="tab-register-btn" data-bs-toggle="pill" data-bs-target="#tab-register" type="button" role="tab" aria-selected="false">Criar conta</button>
          </li>
        </ul>

        <div class="tab-content">
          <div class="tab-pane fade show active" id="tab-login" role="tabpanel">
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label class="form-label small fw-semibold" for="loginEmail">E-mail</label>
                <input type="email" class="form-control" id="loginEmail" required autocomplete="email">
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold" for="loginPassword">Senha</label>
                <input type="password" class="form-control" id="loginPassword" required autocomplete="current-password" minlength="8">
              </div>
              <button class="btn-blush w-100" type="submit" id="loginSubmitBtn">Entrar</button>
              <div class="small mt-2 account-msg" id="loginMsg" role="alert"></div>
            </form>
          </div>

          <div class="tab-pane fade" id="tab-register" role="tabpanel">
            <form id="registerForm" novalidate>
              <div class="mb-3">
                <label class="form-label small fw-semibold" for="registerName">Nome completo</label>
                <input type="text" class="form-control" id="registerName" required autocomplete="name" minlength="2">
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold" for="registerEmail">E-mail</label>
                <input type="email" class="form-control" id="registerEmail" required autocomplete="email">
              </div>
              <div class="mb-3">
                <label class="form-label small fw-semibold" for="registerPassword">Senha</label>
                <input type="password" class="form-control" id="registerPassword" required autocomplete="new-password" minlength="8">
                <div class="form-text">Mínimo de 8 caracteres.</div>
              </div>
              <button class="btn-blush w-100" type="submit" id="registerSubmitBtn">Criar conta</button>
              <div class="small mt-2 account-msg" id="registerMsg" role="alert"></div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/conta.js" defer></script>
</body>
</html>
