<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus pedidos — Adriana Melo Acessórios</title>
<meta name="description" content="Acompanhe o histórico dos seus pedidos na Adriana Melo Acessórios.">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; script-src 'self' https://sdk.mercadopago.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https: data:; connect-src 'self' https://api.mercadopago.com https://viacep.com.br; frame-src https://www.mercadopago.com https://www.mercadopago.com.br; object-src 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">

<link rel="stylesheet" href="css/vendor/bootstrap.min.css">
<link rel="stylesheet" href="css/vendor/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="bow-shape" viewBox="0 0 100 70">
    <path d="M50 35 C50 35 38 6 15 10 C-4 13 -4 47 15 51 C36 56 50 35 50 35 Z"/>
    <path d="M50 35 C50 35 62 6 85 10 C104 13 104 47 85 51 C64 56 50 35 50 35 Z"/>
    <rect x="42" y="26" width="16" height="18" rx="5"/>
    <path d="M45 44 L38 68 L48 60 Z"/>
    <path d="M55 44 L62 68 L52 60 Z"/>
  </symbol>
</svg>

<header class="simple-header">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="index.html" class="plc-brand">
      <svg class="bow-icon"><use href="#bow-shape"/></svg>
      Adriana Melo Acessórios
    </a>
    <div id="navAccount" class="d-flex align-items-center gap-2"></div>
  </div>
</header>

<main class="account-main">
  <div class="container">
    <div class="orders-wrap mx-auto">
      <div class="mb-4">
        <span class="section-eyebrow"><i class="bi bi-bag-heart"></i> sua conta</span>
        <h1 class="section-title" style="font-size:1.8rem">Meus pedidos</h1>
      </div>

      <div id="ordersLoading" class="text-center py-5">
        <div class="spinner-border" role="status" style="color:var(--blush-600)">
          <span class="visually-hidden">Carregando pedidos...</span>
        </div>
        <p class="section-sub mt-3">Carregando seus pedidos...</p>
      </div>

      <div id="ordersLoggedOut" class="account-card text-center d-none">
        <i class="bi bi-lock" style="font-size:2rem; color:var(--blush-600)"></i>
        <p class="mt-3 mb-3">Faça login para ver o histórico dos seus pedidos.</p>
        <a href="conta.html" class="btn-blush">Entrar ou criar conta</a>
      </div>

      <div id="ordersEmpty" class="account-card text-center d-none">
        <i class="bi bi-bag-heart" style="font-size:2rem; color:var(--blush-300)"></i>
        <p class="section-sub mt-3 mb-3">Você ainda não fez nenhum pedido.<br>Que tal escolher um laço?</p>
        <a href="index.html#colecoes" class="btn-blush">Ver coleção</a>
      </div>

      <div id="ordersError" class="account-card text-center d-none">
        <i class="bi bi-exclamation-triangle" style="font-size:2rem; color:var(--blush-700)"></i>
        <p class="section-sub mt-3 mb-3">Não foi possível carregar seus pedidos agora.</p>
        <button type="button" class="btn-outline-blush" id="ordersRetryBtn">Tentar de novo</button>
      </div>

      <div id="ordersList" class="orders-list d-none"></div>
    </div>
  </div>
</main>

<script src="js/error-boundary.js" defer></script>
<script src="js/vendor/bootstrap.bundle.min.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/pricing.js" defer></script>
<script src="js/pedidos.js" defer></script>
</body>
</html>
